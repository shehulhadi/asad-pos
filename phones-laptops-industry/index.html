<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Elbabs Communications</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-view" class="view active">
        <div class="login-card">
            <div class="brand-mark">EC</div>
            <h1>Elbabs Comm.</h1>
            <div class="sub">PHONES & LAPTOPS</div>
            <div style="width: 100%;">
                <input type="password" id="pin-input" class="pin-input" placeholder="••••" maxlength="4" inputmode="numeric" autocomplete="off">
                <button class="btn-primary" onclick="login()">Login</button>
                <div id="login-error" style="color: #fca5a5; margin-top: 16px; display: none; font-weight: 600; font-size: 14px;">Invalid PIN</div>
            </div>
        </div>
    </div>

    <div id="app-view" class="view">
        <header>
            <div class="hdr-brand">
                <div class="brand-mark">EC</div>
                <div>
                    <h2 id="app-title">Elbabs Comm.</h2>
                    <span style="font-size:10px; font-weight:700; color:#6ee7b7; text-transform:uppercase;">Owner</span>
                </div>
            </div>
            <button class="icon-btn" onclick="logout()" title="Logout">
                <svg class="ic" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
            </button>
        </header>
        <main id="main-content"></main>
        <nav id="bottom-nav">
            <button class="nav-btn active" onclick="nav('inventory', this)">
                <span class="pill"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></span>
                Inventory
            </button>
            <button class="nav-btn" onclick="nav('sales', this)">
                <span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14M8 5l8 14M5 9h14M5 14h14"/></svg></span>
                Sales
            </button>
            <button class="nav-btn" onclick="nav('dashboard', this)">
                <span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>
                Dashboard
            </button>
        </nav>
    </div>

    <div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
