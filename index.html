<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Asad Tech POS Suite</title>
    <style>
        :root {
            --ink: #0b1220; --ink-2: #131d33; --ink-3: #1e2a45; --brand: #059669; --brand-soft: #e6f6ef;
            --surface: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e6eaf0;
            --shadow-lg: 0 24px 48px -12px rgba(15, 23, 42, .35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: radial-gradient(900px 400px at 85% -10%, rgba(5,150,105,.35), transparent 60%), 
                        radial-gradient(700px 400px at -10% 110%, rgba(245,158,11,.18), transparent 60%), 
                        var(--ink); 
            color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        
        header { padding: 40px 24px 20px; text-align: center; }
        .brand-mark { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff; background: linear-gradient(135deg, var(--brand) 0%, #10b981 100%); box-shadow: 0 12px 32px -8px rgba(16,185,129,.55); }
        header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.6px; }
        header p { font-size: 14px; color: #94a3b8; margin-top: 6px; letter-spacing: 0.5px; }

        .launcher-container { flex: 1; padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; max-width: 500px; margin: 0 auto; width: 100%; }

        .app-card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            padding: 24px; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            text-decoration: none; 
            color: #fff; 
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .app-card:hover, .app-card:active { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }

        .app-icon { 
            width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex-shrink: 0;
        }
        .app-icon.block { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 8px 20px -6px rgba(245,158,11,.4); }
        .app-icon.phone { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); box-shadow: 0 8px 20px -6px rgba(37,99,235,.4); }
        .app-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .app-info h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .app-info p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
        .app-info .status { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 20px; margin-top: 8px; }
        .status.active { background: rgba(16,185,129,0.2); color: #6ee7b7; }
        .status.dev { background: rgba(245,158,11,0.2); color: #fcd34d; }

        footer { text-align: center; padding: 24px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>

    <header>
        <div class="brand-mark">AT</div>
        <h1>Asad Tech Suite</h1>
        <p>Select an industry module</p>
    </header>

    <div class="launcher-container">
        
        <!-- Block Industry -->
        <a href="./block-industry/index.html" class="app-card">
            <div class="app-icon block">
                <svg viewBox="0 0 24 24"><path d="M12 3l9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
            </div>
            <div class="app-info">
                <h2>Block Industry POS</h2>
                <p>Production, sales, stock & debts for block manufacturing.</p>
                <span class="status active">Live</span>
            </div>
        </a>

        <!-- Phones & Laptops Industry -->
        <a href="./phones-laptops-industry/index.html" class="app-card">
            <div class="app-icon phone">
                <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            </div>
            <div class="app-info">
                <h2>Elbabs Communications</h2>
                <p>Buying & selling used phones, laptops & accessories.</p>
                <span class="status dev">In Development</span>
            </div>
        </a>

    </div>

    <footer>
        &copy; 2026 Asad Tech Concepts. All rights reserved.
    </footer>

</body>
</html>
